name: Daily Auto Commit

# 30 commit langsung dalam satu jalan pagi hari (07:00 WIB),
# + 2x cadangan (07:30, 08:00 WIB) kalau jalan pertama kelewat.
# Tiap jalan menutup kekurangan sampai 30 commit hari itu.
# UTC: 00:00, 00:30, 01:00 = WIB 07:00, 07:30, 08:00
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "30 0 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Top up to 30 commits today
        run: |
          git config user.name "neixcyll"
          # Email noreply GitHub kamu (id 224485812) - ini yang bikin commit kehitung di grafik
          git config user.email "224485812+neixcyll@users.noreply.github.com"
          TODAY=$(TZ=Asia/Jakarta date +"%Y-%m-%d")
          COUNT=$(git log --oneline --grep="daily activity $TODAY" | wc -l)
          echo "Sudah $COUNT commit hari ini, target 30."
          i=$COUNT
          while [ "$i" -lt 30 ]; do
            i=$((i+1))
            STAMP=$(TZ=Asia/Jakarta date +"%Y-%m-%d %H:%M WIB")
            echo "- $STAMP - daily activity #$i" >> activity-log.md
            echo "Last update: $STAMP" > last-update.txt
            git add activity-log.md last-update.txt
            git commit -m "chore: daily activity $TODAY #$i"
          done
          git push
          echo "Selesai: $i commit hari ini."
