name: Daily Auto Commit

# Jalan otomatis 30x sehari + bisa dijalankan manual
# UTC: tiap jam :17 (24x) + :47 di jam 0,4,8,12,16,20 (6x) = 30x/hari
# WIB: tiap jam :17 + 03:47, 07:47, 11:47, 15:47, 19:47, 23:47
# Menit ganjil (bukan :00/:30) supaya tidak menumpuk dengan cron orang lain
# di awal jam — cron GitHub itu best-effort dan sering membuang jadwal :00.
on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update activity log
        run: |
          DATE_WIB=$(TZ=Asia/Jakarta date +"%Y-%m-%d %H:%M WIB")
          DATE_ONLY=$(TZ=Asia/Jakarta date +"%Y-%m-%d")
          echo "- $DATE_WIB - daily activity" >> activity-log.md
          echo "Last update: $DATE_WIB" > last-update.txt
          echo "Updated $DATE_ONLY"

      - name: Commit & push
        run: |
          git config user.name "neixcyll"
          # Email noreply GitHub kamu (id 224485812) - ini yang bikin commit kehitung di grafik
          git config user.email "224485812+neixcyll@users.noreply.github.com"
          git add activity-log.md last-update.txt
          # Kalau tidak ada perubahan, jangan error
          git diff --cached --quiet || git commit -m "chore: daily activity $(TZ=Asia/Jakarta date +%Y-%m-%d\ %H:%M)"
          git push
